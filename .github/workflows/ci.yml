name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version and project targets
        run: |
          xcodebuild -version
          xcodebuild -list -project PastePal.xcodeproj

      - name: Verify expected macOS targets
        run: |
          xcodebuild -list -json -project PastePal.xcodeproj > targets.json
          cat targets.json
          for target in PastePal PastePalHelper PastePalTests; do
            grep -q "\"$target\"" targets.json || { echo "Missing target: $target"; exit 1; }
          done
          if grep -qE 'Flycut-iOS|FlycutHelper|"Flycut"' targets.json; then
            echo "Legacy Flycut or iOS targets must not exist in the PastePal project."
            exit 1
          fi

      - name: Build Debug
        run: |
          xcodebuild \
            -project PastePal.xcodeproj \
            -target PastePal \
            -configuration Debug \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        run: |
          xcodebuild \
            -project PastePal.xcodeproj \
            -scheme PastePal \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test
