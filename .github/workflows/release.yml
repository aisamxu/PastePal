name: Build and Release

# 每次推送 v* 标签时构建 ad-hoc 签名的 DMG，并发布 GitHub Release。
# 不使用 Developer ID 证书，也不做 Apple 公证；首次打开需要右键选择“打开”。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Extract version from tag
        id: get_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Stamp version into the project
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            /usr/bin/sed -i '' "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = ${VERSION};/g" PastePal.xcodeproj/project.pbxproj
          fi
          /usr/bin/sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${GITHUB_RUN_NUMBER};/g" PastePal.xcodeproj/project.pbxproj
          echo "MARKETING_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build archive (unsigned)
        run: |
          xcodebuild \
            -project PastePal.xcodeproj \
            -scheme PastePal \
            -configuration Release \
            -archivePath build/PastePal.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Sign app ad-hoc inside-out
        run: |
          mkdir -p build/Export
          cp -R build/PastePal.xcarchive/Products/Applications/PastePal.app build/Export/
          APP="build/Export/PastePal.app"
          HELPER="$APP/Contents/Library/LoginItems/PastePalHelper.app"

          if [ -d "$HELPER" ]; then
            codesign --force --options runtime \
              --entitlements FlycutHelper/PastePalHelper.entitlements \
              --sign - "$HELPER"
          fi
          codesign --force --options runtime \
            --entitlements PastePal.entitlements \
            --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" || true

      - name: Create DMG and checksum
        run: |
          mkdir -p build/dmg-staging
          cp -R build/Export/PastePal.app build/dmg-staging/
          ln -s /Applications build/dmg-staging/Applications
          hdiutil create -volname "PastePal" -srcfolder build/dmg-staging \
            -ov -format UDZO "$PWD/build/PastePal-${MARKETING_VERSION}.dmg"
          cd build
          shasum -a 256 "PastePal-${MARKETING_VERSION}.dmg" > "PastePal-${MARKETING_VERSION}.dmg.sha256"
          cat "PastePal-${MARKETING_VERSION}.dmg.sha256"
          ls -lh

      - name: Assemble release notes
        run: |
          VERSION="${MARKETING_VERSION}"
          NOTES=""
          if [ -f CHANGELOG.md ]; then
            NOTES="$(awk -v v="$VERSION" '
              $0 ~ "^## " && $0 ~ v {grab=1; next}
              grab && /^## / {exit}
              grab {print}' CHANGELOG.md)"
          fi
          if [ -z "$NOTES" ]; then
            PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')"
            if [ -z "$PREV_TAG" ]; then
              NOTES="$(git log --pretty=format:'- %s (%h)' --reverse)"
            else
              NOTES="$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s (%h)' --reverse)"
            fi
          fi
          {
            echo "$NOTES"
            echo ""
            echo "## Installation"
            echo "1. Download the DMG, open it, and drag PastePal to Applications."
            echo "2. Because this build is ad-hoc signed, right-click PastePal and choose Open the first time."
            echo "3. Grant Accessibility permission when prompted (System Settings > Privacy & Security > Accessibility)."
            echo ""
            echo "If pasting stops working after an update, reset and re-grant the permission:"
            echo '```'
            echo "tccutil reset Accessibility io.github.aisamxu.PastePal"
            echo '```'
            echo ""
            echo "_Ad-hoc signed build; not notarized by Apple._"
          } > release_notes.md
          cat release_notes.md

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PastePal-dmg
          path: |
            build/PastePal-${{ env.MARKETING_VERSION }}.dmg
            build/PastePal-${{ env.MARKETING_VERSION }}.dmg.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/PastePal-${{ env.MARKETING_VERSION }}.dmg
            build/PastePal-${{ env.MARKETING_VERSION }}.dmg.sha256
          body_path: release_notes.md
          name: PastePal ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
